function contests(){view(title('🏆 نجوم الريم وجنى')+`<div class="grid">${tile('نجوم الريم','🦌','خمسة أسئلة متنوعة في رياضيات الخامس',"startQuiz('نجوم الريم',units.slice(0,4).flatMap(u=>u[1]),5)")}${tile('تحدي جنى وأصدقائها · النموذج الأصلي','🌷','ثلاث مراحل للصف الثاني في اللعبة الأصلية','janaOriginal()')}${tile('رحلة إلى الصف السادس','🛰️','تحدٍ تجريبي تمهيدي غير معتمد كفهرس للمنهج',"startQuiz('الصف السادس التجريبي',sixth,5)")}</div><div class="card" style="margin-top:14px"><h3>قواعد المغامرة</h3><p>لا ترتيب علني ولا مؤقت إلزامي. تُحتسب دقة المحاولات والإنجاز الشخصي، ويمكن تكرار التدريب. المسابقات هنا محلية تجريبية.</p></div>${resources('contest')}`)}
let fi=0;function flash(){let d=units[0][1][fi%units[0][1].length];view(title('🃏 بطاقات الذاكرة','games()')+`<div class="card" style="text-align:center"><p>بطاقة ${fi%11+1} من 11</p><div class="question">${esc(d[2])}</div>${soundBtn(d[2])}<p id="flip" class="hide" style="font-size:25px;font-weight:bold">${esc(d[3])}<br><small>${esc(d[1])}</small></p><div class="actions" style="justify-content:center"><button class="primary" onclick="$('#flip').classList.toggle('hide')">اقلب البطاقة</button><button onclick="fi++;flash()">التالية</button></div></div>`)}
function library(){view(title('📚 مكتبة الريم')+`<div class="card"><h3>الكتب المدرسية الكويتية</h3><p>روابط من مكتبة وزارة التربية، مع مصادر إضافية للتدريب. تحتاج الروابط الخارجية إلى الإنترنت.</p><a class="btn" href="https://elibrary.moe.edu.kw/" target="_blank" rel="noopener">مكتبة وزارة التربية</a></div><div class="grid" style="margin-top:14px">${subjects.map(s=>`<div class="card"><h3>${s[2]} ${esc(s[1])}</h3><a class="btn" href="${book(s[6])}" target="_blank" rel="noopener">فتح الكتاب</a></div>`).join('')}<div class="card"><h3>English Workbook</h3><a class="btn" href="${book(3685)}" target="_blank" rel="noopener">كتاب التدريبات</a></div><div class="card"><h3>مراجعة الرياضيات</h3><a class="btn" href="${book(4844)}" target="_blank" rel="noopener">خطة التوزيع الرسمية</a></div><div class="card"><h3>قصص وبطاقات</h3><p>مغامرة الأعداد: إذا جمعت الريم 3 نجوم كل يوم لمدة 4 أيام، فكم نجمة تجمع؟</p>${soundBtn('إذا جمعت الريم ثلاث نجوم كل يوم لمدة أربعة أيام، فكم نجمة تجمع؟')}<button onclick="flash()">بطاقات الرياضيات</button></div></div>${resources('library')}`)}function extras(){view(title('🎨 عالم المهارات')+`<div class="grid">${[['art','الفنون التشكيلية','🎨','الألوان والإبداع'],['pe','التربية البدنية','🏃','نشاط وحركة آمنة'],['music','التربية الموسيقية','🎵','إيقاع واستماع']].filter(x=>!state.hidden.includes(x[0])).map(x=>tile(x[1],x[2],x[3],`subject('${x[0]}')`)).join('')}</div>${resources('extra')}`)}function extraSection(id){let s=state.extra.find(x=>x.id===id);if(s)view(title(s.name)+resources(id))}
function resultsTable(rows){return `<div class="scroll"><table><thead><tr><th>الحساب</th><th>النشاط</th><th>الدقة</th><th>صحيحة / إضافية</th><th>التاريخ</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.name)}</td><td>${r.accuracy}%</td><td>${r.correct} / ${r.wrong}</td><td>${esc(r.date)}</td></tr>`).join('')||'<tr><td colspan="5">لا توجد نتائج بعد.</td></tr>'}</tbody></table></div>`}function dashboard(){if(role==='guest'){loginDialog();return}$('#who').textContent={student:'لوحة الطالبة',parent:'لوحة ولي الأمر',teacher:'لوحة المعلم',admin:'لوحة المشرف'}[role];if(role==='admin'){admin();return}if(role==='teacher'){view(title('👩‍🏫 لوحة المعلم')+`<div class="card"><h3>نتائج التدريبات المركزية</h3>${resultsTable(state.results)}<div class="actions"><button onclick="window.print()">طباعة</button><button onclick="exportCSV()">تصدير النتائج</button><button onclick="logout()">خروج</button></div></div>${resources('teacher')}`);return}let rows=state.results.filter(x=>x.id===uid),u=student(uid);view(title(role==='student'?'⭐ لوحتي وإنجازاتي':'👪 متابعة ولي الأمر')+`<div class="grid"><div class="card"><h3>${esc(u.name)}</h3><p>الحساب ${uid}</p><span class="pill">${rows.length} أنشطة مكتملة</span></div><div class="card"><h3>نجوم الإنجاز</h3><p>⭐ ${rows.reduce((a,b)=>a+b.correct,0)} نجمة</p></div></div><div class="card" style="margin-top:14px"><h3>نتائجي</h3>${resultsTable(rows)}<div class="actions"><button onclick="window.print()">طباعة النتائج</button>${rows.length?'<button onclick="certificate(\''+uid+'\')">شهادة إنجاز</button>':''}${role==='student'?'<button onclick="parentCode()">ربط ولي الأمر</button><button onclick="changePin(uid,false)">تغيير رمز الدخول</button><button class="primary" onclick="games()">ابدئي التعلم</button>':''}<button onclick="logout()">خروج</button></div></div>`)}
function certificate(id){if(!validID(id)||!token||(!['admin','teacher'].includes(role)&&id!==uid))return;let r=state.results.filter(x=>x.id===id);view(title('شهادة إنجاز تعليمية','dashboard()')+`<div class="certificate"><div style="font-size:50px">🦌 🏅</div><h3>منصة الريم التعليمية</h3><h1>شهادة إنجاز وتقدير</h1><p>تُمنح إلى</p><h2>${esc(student(id).name)}</h2><p>تقديرًا لمثابرتها وإكمالها ${r.length} أنشطة تعليمية.</p><p>كل يوم خطوة جديدة نحو التميز.</p><p>التاريخ: ${new Date().toLocaleDateString('ar-KW')} &nbsp; | &nbsp; إشراف منصة الريم</p><small>شهادة تحفيزية للتدريب، وليست وثيقة رسمية.</small></div><div class="actions"><button class="primary" onclick="window.print()">طباعة / حفظ PDF</button></div>`)}function exportCSV(){if(!token||!['admin','teacher'].includes(role))return;let rows=state.results;let csv='\ufeff'+[['الحساب','النشاط','الدقة','الصحيحة','المحاولات الإضافية','التاريخ'],...rows.map(r=>[r.id,r.name,r.accuracy,r.correct,r.wrong,r.date])].map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='reem-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function sections(){return [['home','الواجهة الرئيسية'],...subjects.map(s=>[s[0],s[1]]),['games','الألعاب'],['blender','خلاط الريم التفاعلي'],['library','المكتبة'],['contest','المسابقات'],['dashboard','لوحتي'],['extra','عالم المهارات'],['art','الفنون'],['pe','الرياضة'],['music','الموسيقى'],['teacher','لوحة المعلم'],['media','مسرح الريم التعليمي'],['jana','تحدي جنى وأصدقائها'],...state.extra.map(x=>[x.id,x.name])]}function admin(){if(role!=='admin'||!token){loginDialog();return}view(title('⚙ لوحة إشراف منصة الريم')+`<div class="card"><h3>التحكم بالواجهة</h3><p class="small">تُحفظ إعدادات المنصة مركزيًا، ويقتصر تعديلها على المشرف.</p><label>الشعار</label><input id="motto" value="${esc(state.settings.motto)}"><div class="actions"><button onclick="state.settings.motto=$('#motto').value;save();admin()">حفظ الشعار</button><button onclick="state.settings.flag=!state.settings.flag;save();admin()">ألوان العلم: ${state.settings.flag?'ظاهرة':'مخفية'}</button><button onclick="state.settings.motion=!state.settings.motion;save();admin()">الحركة: ${state.settings.motion?'مفعلة':'متوقفة'}</button><button onclick="state.settings.sound=!state.settings.sound;save();admin()">الصوت: ${state.settings.sound?'مفعل':'متوقف'}</button>${anthemAdminButton()}</div></div><div class="grid" style="margin-top:14px"><div class="card"><h3>إدارة 200 حساب</h3><p>النطاق 1000 – 1199. لم تُسجل أسماء حقيقية.</p><button onclick="accounts()">فتح كشف الحسابات</button></div><div class="card"><h3>النتائج والشهادات</h3><p>${state.results.length} نتيجة تدريبية</p><button onclick="adminResults()">فتح سجل النتائج</button></div><div class="card"><h3>إضافة قسم جديد</h3><input id="newsec" placeholder="عنوان القسم"><button onclick="addSection()">إضافة</button></div></div><div class="card" style="margin-top:14px"><h3>إدارة ظهور الأقسام</h3><div class="actions">${sections().filter(s=>s[0]!=='home'&&s[0]!=='teacher').map(s=>`<button onclick="toggleSection('${s[0]}')">${state.hidden.includes(s[0])?'○':'✓'} ${esc(s[1])}</button>`).join('')}</div></div><div class="card" style="margin-top:14px"><h3>إضافة محتوى أو رابط أو صورة</h3><form id="resourceform"><label>القسم</label><select id="sec">${sections().map(s=>`<option value="${s[0]}">${esc(s[1])}</option>`).join('')}</select><label>العنوان</label><input id="rt" required><label>النص أو الوصف</label><textarea id="rd" rows="2"></textarea><label>رابط المورد (https)</label><input id="ru" type="url"><label>رابط الصورة (https)</label><input id="ri" type="url"><div class="actions"><button class="primary" type="submit">حفظ المورد</button></div></form><div id="rlist">${state.resources.map((x,i)=>`<div class="lesson"><span>${esc(x.title)} · ${esc(sections().find(s=>s[0]===x.section)?.[1])}</span><div><button onclick="editResource(${i})">تعديل</button> <button onclick="state.resources.splice(${i},1);save();admin()">حذف</button></div></div>`).join('')}</div></div><div class="actions"><button onclick="logout()">خروج من الإشراف</button></div>`);$('#resourceform').onsubmit=e=>{e.preventDefault();let x={section:$('#sec').value,title:$('#rt').value.trim(),text:$('#rd').value,url:$('#ru').value,img:$('#ri').value};if(!x.title)return;if((x.url&&!safeURL(x.url))||(x.img&&!safeURL(x.img))){alert('أدخلي رابط http أو https');return}if(editIndex!==null){state.resources[editIndex]=x;editIndex=null}else state.resources.push(x);save();admin()}}let editIndex=null;function editResource(i){let x=state.resources[i];editIndex=i;$('#sec').value=x.section;$('#rt').value=x.title;$('#rd').value=x.text;$('#ru').value=x.url;$('#ri').value=x.img;$('#rt').focus()}function addSection(){let name=$('#newsec').value.trim();if(!name)return;state.extra.push({id:'x'+Date.now(),name});save();admin()}function toggleSection(s){state.hidden=state.hidden.includes(s)?state.hidden.filter(x=>x!==s):[...state.hidden,s];save();admin()}function accounts(){if(role!=='admin'||!token)return;view(title('إدارة الحسابات','admin()')+`<div class="card"><div class="actions"><button class="primary" onclick="bulkStudentDialog()">تفعيل مجموعة حسابات وإصدار الرموز المؤقتة</button><button class="ghost" onclick="bulkStudentDialog('reissue')">إعادة إصدار الرموز الأولية (8 أرقام)</button></div><label>بحث برقم الحساب أو الاسم</label><input id="accountsearch" oninput="renderAccounts(this.value)" placeholder="1000"><div class="scroll"><table><thead><tr><th>الرقم</th><th>الاسم</th><th>الحالة</th><th>الرمز</th><th>إجراءات</th></tr></thead><tbody id="accountrows"></tbody></table></div></div>`);renderAccounts('')}function renderAccounts(q){$('#accountrows').innerHTML=Array.from({length:200},(_,i)=>String(1000+i)).filter(id=>id.includes(q)||student(id).name.includes(q)).map(id=>{let u=student(id);return `<tr><td>${id}</td><td>${esc(u.name)}</td><td>${u.active===false?'موقوف':'متاح'}</td><td>${u.linked?'مرتبط':'محجوز'}</td><td><button onclick="editAccount('${id}')">إدارة</button> <button onclick="certificate('${id}')">شهادة</button></td></tr>`}).join('')}function editAccount(id){let u=student(id);dlg.innerHTML=`<h3>إدارة الحساب ${id}</h3><label>اسم العرض</label><input id="uname" value="${esc(u.name)}"><label>الحالة</label><select id="ust"><option value="1" ${u.active!==false?'selected':''}>متاح</option><option value="0" ${u.active===false?'selected':''}>موقوف</option></select><div class="actions"><button onclick="saveAccount('${id}')">حفظ</button><button onclick="resetAccount('${id}')">إعادة إصدار الرمز الأولي (8 أرقام)</button><button onclick="dlg.close()">إغلاق</button></div>`;dlg.showModal()}function adminResults(){if(role!=='admin'||!token)return;view(title('سجل النتائج','admin()')+`<div class="card">${resultsTable(state.results)}<div class="actions"><button onclick="window.print()">طباعة</button><button onclick="exportCSV()">تصدير CSV</button></div><label>إصدار شهادة للحساب</label><input id="certid" inputmode="numeric" placeholder="1000"><button onclick="certificate($('#certid').value)">معاينة الشهادة</button></div>`)}</script><script src="extras.js"></script><script src="blender.js"></script><script src="portals.js"></script><script>boot();</script></body></html>
